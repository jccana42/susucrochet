<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SusuCrochet</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Georgia,serif;
    background:linear-gradient(135deg,#ffe6f1,#fff7d8,#d9fff2,#d8f2ff);
    background-size:400% 400%;
    animation:fondo 14s ease infinite;
}

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.glow{
    position:absolute;
    width:70vmin;
    height:70vmin;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 65%);
    filter:blur(10px);
    animation:pulseGlow 5s ease-in-out infinite;
}

.card{
    position:relative;
    width:min(86vw,850px);
    padding:50px;
    border-radius:38px;
    background:rgba(255,255,255,.42);
    backdrop-filter:blur(18px);
    box-shadow:
        0 30px 80px rgba(255,120,170,.28),
        inset 0 0 0 2px rgba(255,255,255,.55);
    text-align:center;
    animation:cardIn 1.4s cubic-bezier(.16,1,.3,1) forwards;
}

.logo-wrap{
    position:relative;
    overflow:hidden;
    display:inline-block;
    animation:floatLogo 4s ease-in-out infinite 1.4s;
}

.logo{
    width:min(72vw,650px);
    display:block;
    filter:
        drop-shadow(0 18px 22px rgba(160,80,120,.25))
        drop-shadow(0 0 18px rgba(255,255,255,.8));
    opacity:0;
    transform:scale(.75) translateY(30px);
    animation:logoIn 1.5s cubic-bezier(.16,1,.3,1) .3s forwards;
}

.logo-wrap::after{
    content:"";
    position:absolute;
    top:-20%;
    left:-120%;
    width:55%;
    height:140%;
    background:linear-gradient(
        115deg,
        transparent 0%,
        rgba(255,255,255,.15) 30%,
        rgba(255,255,255,.85) 50%,
        rgba(255,255,255,.15) 70%,
        transparent 100%
    );
    transform:skewX(-18deg);
    animation:shine 3.2s ease-in-out 2s infinite;
}

.subtitle{
    margin-top:28px;
    font-size:clamp(22px,4vw,42px);
    color:#8c4a68;
    letter-spacing:.04em;
    opacity:0;
    transform:translateY(20px);
    animation:textIn 1s ease 1.1s forwards;
}

.dots{
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:10px;
}

.dots span{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#d86d9b;
    opacity:.45;
    animation:dot 1.4s ease-in-out infinite;
}

.dots span:nth-child(2){ animation-delay:.2s; }
.dots span:nth-child(3){ animation-delay:.4s; }

.particle{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:rgba(255,255,255,.65);
    box-shadow:0 0 18px rgba(255,255,255,.8);
    animation:rise 12s linear infinite;
}

.p1{ left:10%; bottom:-30px; animation-delay:0s; }
.p2{ left:25%; bottom:-30px; animation-delay:3s; width:12px; height:12px; }
.p3{ left:70%; bottom:-30px; animation-delay:1.5s; }
.p4{ left:85%; bottom:-30px; animation-delay:5s; width:14px; height:14px; }
.p5{ left:50%; bottom:-30px; animation-delay:7s; width:10px; height:10px; }

@keyframes fondo{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(50px) scale(.92);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes logoIn{
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

@keyframes textIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes floatLogo{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
}

@keyframes shine{
    0%{ left:-120%; }
    45%,100%{ left:130%; }
}

@keyframes pulseGlow{
    0%,100%{
        transform:scale(.92);
        opacity:.7;
    }
    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

@keyframes rise{
    from{
        transform:translateY(0) scale(.8);
        opacity:0;
    }
    15%{
        opacity:.8;
    }
    to{
        transform:translateY(-115vh) scale(1.4);
        opacity:0;
    }
}

@keyframes dot{
    0%,100%{
        transform:translateY(0);
        opacity:.35;
    }
    50%{
        transform:translateY(-8px);
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="glow"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

    <div class="card">
        <div class="logo-wrap">
            <img src="susulogo.png" alt="SusuCrochet" class="logo">
        </div>

        <div class="subtitle">Página en construcción</div>

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

</div>

</body>
</html>

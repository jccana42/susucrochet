<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SusuCrochet</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #fff1f7, transparent 35%),
        radial-gradient(circle at bottom right, #d8fff0, transparent 35%),
        linear-gradient(135deg, #ffe4ec, #fff7d6, #d8f7ff);
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

.card {
    background: rgba(255, 255, 255, 0.65);
    border: 3px solid rgba(255, 170, 210, 0.7);
    border-radius: 32px;
    padding: 50px 35px;
    box-shadow: 0 20px 60px rgba(180, 90, 130, 0.25);
    backdrop-filter: blur(8px);
}

.logo {
    width: min(80vw, 420px);
    height: auto;
    display: block;
    margin: 0 auto 25px auto;
    animation: logoFloat 3.5s ease-in-out infinite;
}

p {
    margin-top: 22px;
    font-size: 1.5rem;
    color: #6a5a64;
    letter-spacing: 2px;
}

.heart {
    font-size: 2.5rem;
    margin-bottom: 20px;
    animation: float 2.5s ease-in-out infinite;
}

@keyframes logoFloat {
    0% {
        transform: translate(0, 0) rotate(0deg);
    }
    25% {
        transform: translate(8px, -8px) rotate(1deg);
    }
    50% {
        transform: translate(0, -14px) rotate(0deg);
    }
    75% {
        transform: translate(-8px, -8px) rotate(-1deg);
    }
    100% {
        transform: translate(0, 0) rotate(0deg);
    }
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}

@media (max-width: 600px) {
    .logo {
        width: 85vw;
    }

    p {
        font-size: 1.1rem;
    }

    .card {
        margin: 20px;
        padding: 40px 25px;
    }
}
</style>
</head>

<body>
    <div class="card">
        <div class="heart">🧶 💗 🧵</div>
        <img src="susulogo.png" alt="SusuCrochet" class="logo">
        <p>Coming soon!</p>
    </div>
</body>
  </html>
